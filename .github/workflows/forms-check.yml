name: Validate PHP forms
on:
  push:
    branches: [main]
    paths: ['enviar.php', 'backend/**', 'scripts/test-forms.py', '.github/workflows/forms-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: php -l enviar.php
      - run: python3 scripts/test-forms.py
