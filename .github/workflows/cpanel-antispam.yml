name: Configure cPanel antispam
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpanel-antispam
  cancel-in-progress: false
jobs:
  antispam:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect spam settings through authenticated HTTPS
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python3 scripts/antispam-cpanel.py
